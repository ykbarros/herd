    --pink:#ff8fc7;
    --green:#2fd47a;
    --orange:#ff9d3b;

    --accent:#f5e7a1;
    --accent-ink:#0f1211;

    --body:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{

  input{font-family:inherit}

  .app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;

  .flood{position:fixed;inset:0;z-index:-1;pointer-events:none;

  .screen{flex:1;display:flex;flex-direction:column;gap:14px;animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* type */

  .eyebrow{color:var(--ink-faint);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .dim{color:var(--ink-dim)}
  .faint{color:var(--ink-faint)}
  .center{text-align:center}
  .small{font-size:13px}
  h2{margin:0}

  /* brand */
  .brand{padding:10px 2px 4px}
  .brand h1{font-family:var(--display);font-weight:900;margin:0;line-height:.86;font-size:clamp(64px,24vw,112px);letter-spacing:-.05em;text-transform:uppercase}
  .brand h1 i{font-style:normal;color:var(--pink)}
  .brand h1 u{text-decoration:none;color:var(--green)}
  .brand .ko{font-size:15px;color:var(--ink-dim);margin-top:10px}

  /* mode cards */
  .modes{display:flex;flex-direction:column;gap:12px}
  .mode{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 18px 22px;background:var(--panel);
    border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;
    transition:transform .12s ease}
  .mode:active{transform:scale(.98)}
  .mode .swatch{position:absolute;inset:0 auto 0 0;width:7px;background:var(--mc)}
  .mode .blob{position:absolute;top:-50px;right:-40px;width:150px;height:150px;border-radius:50%;background:var(--mc);opacity:.16;filter:blur(6px)}
  .mode .name{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.03em;text-transform:uppercase;color:var(--mc);position:relative;line-height:1}
  .mode .pitch{position:relative;color:var(--ink);font-size:15px;line-height:1.35}

  /* buttons */
  .cta{width:100%;padding:18px;border-radius:20px;background:var(--accent);color:var(--accent-ink);
    font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.02em;text-transform:uppercase;
    box-shadow:0 12px 30px -12px color-mix(in srgb,var(--accent) 75%,transparent);transition:transform .1s ease}
  .cta:active{transform:translateY(2px) scale(.99)}
  .cta.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .cta .sub{display:block;font-family:var(--body);font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;opacity:.75;margin-top:4px}
  .ghost{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);font-weight:700;font-size:13px}
  .ghost:active{transform:scale(.96)}
  .ghost.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .link{color:var(--accent);font-weight:700;font-size:14px;padding:6px 2px}
  .row{display:flex;gap:10px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1}
  .stack{display:flex;flex-direction:column;gap:10px}
  .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
  .topback{align-self:flex-start;color:var(--ink-dim);font-weight:700;font-size:14px;padding:6px 2px}

  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
  .seg button{padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

  /* panels */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
  .card.tint{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:12px}
  .rules li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;gap:10px;line-height:1.4;font-size:15px}
  .rules li::before{content:counter(r);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    font-family:var(--display);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}

  /* inputs */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .inp{width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px}
  .inp:focus{outline:none;border-color:var(--accent)}
  .inp.code{font-family:var(--display);font-size:34px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:12px}
  .inp.big{font-size:24px;font-weight:800;text-align:center;padding:16px}
  .err{color:var(--miss);font-size:14px;font-weight:600}

  /* players */
  .plist{display:flex;flex-direction:column;gap:8px}
  .p{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}
  .p .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
  .p .dot.off{background:var(--ink-faint)}
  .p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p .you{color:var(--ink-faint);font-weight:600;font-size:12px}
  .p .x{color:var(--ink-faint);font-size:20px;line-height:1;padding:0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:15px}
  .chip.done{background:color-mix(in srgb,var(--good) 18%,var(--panel));border-color:color-mix(in srgb,var(--good) 40%,transparent)}

  /* game top bar */
  .gtop{display:flex;align-items:center;gap:8px}
  .mchip{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:15px;color:var(--accent);letter-spacing:-.01em}
  .gtop .info{flex:1;color:var(--ink-dim);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:900;color:var(--ink-dim);font-size:16px;flex:none}

  /* prompt card */
  .prompt{border-radius:24px;padding:22px 20px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
  .prompt::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--accent)}
  .prompt .q{font-size:clamp(22px,6.4vw,29px);font-weight:800;line-height:1.2;text-wrap:balance;margin-top:6px}
  .prompt .q.sm{font-size:19px}
  .prompt .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);transform:translateY(-.1em)}

  .hint{margin:0;color:var(--ink-dim);font-size:15px;line-height:1.45}
  .hint b{color:var(--ink)}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--ink-dim);font-weight:700;font-size:15px;padding:14px;text-align:center}
  .wait::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex:none}

  .handoff{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:6px 0}
  .handoff .to{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,13vw,64px);line-height:.9;letter-spacing:-.03em;color:var(--accent);word-break:break-word}
  .handoff .lbl{color:var(--ink-dim);font-size:15px}
  .handoff .warn{font-size:14px;color:var(--ink-faint);max-width:30ch;line-height:1.4}

  /* multiple choice options */
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts.two{flex-direction:row}
  .opts.two .opt{flex:1;min-height:96px;justify-content:center;text-align:center;font-size:20px}
  .opt{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--panel);border:2px solid var(--line);font-weight:800;font-size:17px;text-align:left;line-height:1.2}
  .opt .k{font-family:var(--display);color:var(--ink-faint);font-size:15px;flex:none}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
  .opt[aria-pressed="true"] .k{color:var(--accent)}

  /* answer groups */
  .groups{display:flex;flex-direction:column;gap:8px}
  .grp{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;padding:13px 14px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
  .grp .top{display:flex;align-items:center;gap:10px}
  .grp .lbl{flex:1;min-width:0;font-weight:800;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
  .grp .cnt{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
  .grp .who{display:flex;flex-wrap:wrap;gap:6px}
  .grp .who span{font-size:13px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-dim)}
  .grp .who span i{font-style:normal;color:var(--ink-faint);font-weight:600}
  .grp.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
  .grp.target{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .grp.win{border-color:color-mix(in srgb,var(--good) 70%,transparent);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
  .grp.win .cnt{color:var(--good)}
  .grp.alone{border-color:color-mix(in srgb,var(--pink) 50%,transparent)}
  .grp .acts{display:flex;gap:8px}

  /* standings */
  .table{display:flex;flex-direction:column;gap:6px}
  .st{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}
  .st .n{font-family:var(--display);width:24px;text-align:center;color:var(--ink-faint);font-size:14px;flex:none}
  .st .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st .val{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
  .st .d{font-size:12px;font-weight:800;padding:3px 7px;border-radius:999px}
  .st.me{outline:2px solid var(--accent);outline-offset:-2px}
  .st.lead{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
  .tm{width:12px;height:12px;border-radius:50%;flex:none;background:var(--orange)}
  .tm.g{background:var(--green)}
  .plus{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
  .pinkcow{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--pink) 22%,transparent);color:var(--pink);white-space:nowrap}
  .teamtag{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
  .teamtag.g{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
  .teamtag.o{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}

  .banner{border-radius:20px;padding:16px;text-align:center;font-weight:800;font-size:17px;line-height:1.35}
  .banner.good{background:color-mix(in srgb,var(--good) 16%,var(--panel));color:var(--good)}
  .banner.bad{background:color-mix(in srgb,var(--miss) 14%,var(--panel));color:var(--miss)}
  .banner.pink{background:color-mix(in srgb,var(--pink) 16%,var(--panel));color:var(--pink)}
  .banner.neutral{background:var(--panel);color:var(--ink)}
  .banner .big{display:block;font-family:var(--display);font-size:clamp(28px,9vw,38px);line-height:1;margin-bottom:6px;text-transform:uppercase;letter-spacing:-.02em;overflow-wrap:anywhere}

  /* sheet */
  .sheet{position:fixed;inset:0;background:rgba(5,7,6,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
  .sheet .in{width:100%;max-width:540px;max-height:88dvh;overflow:auto;background:var(--ground);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .25s ease both}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(30px)}}
  .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;animation:rise .2s ease both;max-width:90vw;text-align:center}
  .netbar{background:color-mix(in srgb,var(--miss) 18%,var(--panel));color:var(--ink);border:1px solid color-mix(in srgb,var(--miss) 45%,transparent);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .room-code{font-family:var(--display);font-size:clamp(54px,18vw,80px);letter-spacing:.14em;line-height:1;color:var(--accent);text-align:center}
  hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
</style>
</head>

<script>
(() => {
"use strict";

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const app = $("#app"), layer = $("#layer");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Math.random().toString(36).slice(2, 10);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const params = new URLSearchParams(location.search);
// per-tab identity in a room, so two tabs on one device are two players (survives reloads)
const tabStore = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
};
const cleanName = n => String(n || "").replace(/\s+/g, " ").trim().slice(0, 16);
const cleanAns = s => String(s || "").replace(/\s+/g, " ").trim().slice(0, 40);
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ";
const newCode = () => Array.from({ length: 4 }, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join("");
const PREFIX = "herd-v1-";
const RTC_OK = typeof RTCPeerConnection !== "undefined" || params.get("net") === "local";
const NO_RTC = "Rooms don't work in this browser. Open Herd in Safari or Chrome to start or join a room.";

const DEFAULTS = {
  herd:  { goal: 8 },
  green: { rounds: 15 }
};
const freshSets = () => JSON.parse(JSON.stringify(DEFAULTS));

/* ================= state ================= */
let S = null;      // shared game state; the host (or the single phone) is the source of truth
let ME = null;     // my player id in a room; null when everyone shares one phone
let ROLE = null;   // 'pass' | 'host' | 'guest'
const U = {
  screen: "home", pick: null, err: "", net: "",
  pp: [],                                       // pass-and-play roster [{id,name}], fresh each visit
  sets: Object.assign(freshSets(), store.get("herd-sets", {})),
  name: store.get("herd-name", ""),
  joinCode: (params.get("room") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4),
  drafts: {}, sheet: null, sel: null
};
if (U.joinCode) U.screen = "join";

/* ================= decks ================= */
// A card kind is "herd" or "blank" (typed answers) or "pick2"/"pick4" (tap an option).
const typed = kind => kind === "herd" || kind === "blank";
function makeDeck(kind) {
  const seen = new Set(store.get("herd-seen-" + kind, []));
  const all = [...DECK[kind].keys()];
  const fresh = shuffle(all.filter(i => !seen.has(i)));
  return fresh.concat(shuffle(all.filter(i => seen.has(i))));
}
function markSeen(kind, i) {
  let s = store.get("herd-seen-" + kind, []);
  if (!s.includes(i)) s.push(i);
  if (s.length >= DECK[kind].length) s = [i];
  store.set("herd-seen-" + kind, s);
}
// the kind of question each round asks; Green Team Wins deals the three kinds evenly, shuffled
function kindSeq(mode, rounds) {
  if (mode === "herd") return ["herd"];
  const per = Math.ceil(rounds / 3);
  return shuffle([].concat(...["blank", "pick2", "pick4"].map(k => Array(per).fill(k)))).slice(0, rounds);
}
const kindOf = g => g.seq[(g.round - 1) % g.seq.length];
const cardOf = g => { const k = kindOf(g); return DECK[k][g.decks[k][g.di[k] % g.decks[k].length]]; };
function drawCard(g, skip) {
  const k = kindOf(g);
  if (skip) g.di[k]++;
  markSeen(k, g.decks[k][g.di[k] % g.decks[k].length]);
}
// split a card into its question and (for pick cards) its options
const parts = g => { const [q, ...opts] = cardOf(g).split("|"); return { q, opts, kind: kindOf(g) }; };

/* ================= answer matching ================= */
// "The Pizzas!" and "pizza" land in the same group; anything smarter is the host's call in the merge step
function keyOf(s) {
  let t = String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/&/g, " and ").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  t = t.replace(/^(the|a|an) /, "");
  t = t.split(" ").map(w =>
    w.length > 3 && /ies$/.test(w) ? w.slice(0, -3) + "y" :
    w.length > 3 && /(ches|shes|sses|xes|zes)$/.test(w) ? w.slice(0, -2) :
    w.length > 3 && /[^su]s$/.test(w) && !/is$/.test(w) ? w.slice(0, -1) : w).join("");
  return t || String(s).toLowerCase();
}
const bySize = groups => groups.sort((a, b) => b.length - a.length);
function autoGroup(g) {
  const m = new Map();
  g.roster.forEach(p => { if (g.ans[p] == null) return; const k = keyOf(g.ans[p]); if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
  return bySize([...m.values()]);
}
// a group's label: its most common spelling
function groupLabel(g, grp) {
  if (!typed(kindOf(g))) return parts(g).opts[g.ans[grp[0]]] ?? "?";
  const c = new Map();
  grp.forEach(p => { const a = g.ans[p]; c.set(a.toLowerCase(), (c.get(a.toLowerCase()) || { a, n: 0 })); c.get(a.toLowerCase()).n++; });
  return [...c.values()].sort((x, y) => y.n - x.n)[0].a;
}
// the one group that wins the round: strictly the biggest, and at least two people
function winIndex(groups) {
  if (!groups.length) return -1;
  const top = groups[0].length;
  return top >= 2 && groups.filter(x => x.length === top).length === 1 ? 0 : -1;
}

/* ================= players ================= */
const player = id => S && S.players.find(p => p.id === id);
const nm = id => { const p = player(id); return p ? p.name : "?"; };
const online = id => { const p = player(id); return !!(p && p.on); };
// may this device act for player `pid`?
const mine = pid => ROLE === "pass" || ME === pid || (ROLE === "host" && !online(pid));
const isHostDevice = () => ROLE !== "guest";
function uniqueName(n) {
  let base = n || "Player", out = base, k = 2;
  while (S.players.some(p => p.name.toLowerCase() === out.toLowerCase())) out = base + " " + k++;
  return out;
}

/* ================= game setup ================= */
function startGame() {
  const roster = S.players.map(p => p.id), set = S.sets[S.mode];
  const seq = kindSeq(S.mode, set.rounds || 0);
  const kinds = [...new Set(seq)];
  const g = { type: S.mode, roster, round: 1, seq, decks: {}, di: {}, phase: "answer", ans: {}, groups: [], win: -1, res: null,
    score: Object.fromEntries(roster.map(p => [p, 0])) };
  kinds.forEach(k => { g.decks[k] = makeDeck(k); g.di[k] = 0; });
  if (S.mode === "herd") { g.goal = set.goal; g.pink = null; g.winners = []; }
  else { g.rounds = set.rounds; g.green = {}; }
  drawCard(g);
  S.stage = "play";
  S.g = g;
}
const minPlayers = mode => MODES[mode].min;

function closeAnswers(g) {
  if (typed(kindOf(g))) { g.groups = autoGroup(g); g.phase = "match"; return; }
  const m = new Map();
  g.roster.forEach(p => { if (g.ans[p] == null) return; if (!m.has(g.ans[p])) m.set(g.ans[p], []); m.get(g.ans[p]).push(p); });
  g.groups = bySize([...m.values()]);
  scoreRound(g);
}
function scoreRound(g) {
  bySize(g.groups);
  g.win = winIndex(g.groups);
  const herd = g.win > -1 ? g.groups[g.win] : [];
  if (g.type === "herd") {
    herd.forEach(p => g.score[p]++);
    const alone = g.groups.filter(x => x.length === 1);
    const was = g.pink;
    if (alone.length === 1) g.pink = alone[0][0];
    g.res = { gain: herd.slice(), pinkFrom: was, pinkTo: g.pink, moved: alone.length === 1 && was !== g.pink, alone: alone.length === 1 ? alone[0][0] : null };
    const cand = g.roster.filter(p => g.score[p] >= g.goal && p !== g.pink);
    const best = Math.max(0, ...cand.map(p => g.score[p]));
    g.winners = cand.filter(p => g.score[p] === best);
  } else {
    const delta = {}, before = Object.assign({}, g.green);
    g.roster.forEach(p => {
      const inHerd = herd.includes(p);
      delta[p] = inHerd ? (g.green[p] ? 2 : 1) : 0;
      g.score[p] += delta[p];
      g.green[p] = inHerd;
    });
    g.res = { delta, before };
  }
  g.phase = "reveal";
}
const gameOver = g => g.type === "herd" ? g.winners.length > 0 : g.round >= g.rounds;

/* ================= reducer (runs on the host / the single phone) ================= */
function apply(a, from) {
  if (!S || !a || typeof a.type !== "string") return;
  const host = ROLE === "pass" || from === S.hostId;
  const may = pid => ROLE === "pass" || from === pid || (from === S.hostId && !online(pid));
  const g = S.g;
  const v = a.v;

  /* ---- lobby / meta ---- */
  switch (a.type) {
    case "setMode": if (host && S.stage === "lobby" && MODES[v]) S.mode = v; return;
    case "set": {
      if (!host || !S.sets[S.mode] || !(a.k in DEFAULTS[S.mode])) return;
      S.sets[S.mode][a.k] = Number(v);
      return;
    }
    case "kick": {
      if (!host || v === S.hostId || S.stage !== "lobby") return;
      S.players = S.players.filter(p => p.id !== v);
      const c = Net.conns.get(v); if (c) { try { c.send({ t: "kicked" }); } catch (e) {} setTimeout(() => { try { c.close(); } catch (e) {} }, 200); Net.conns.delete(v); }
      return;
    }
    case "start":
      if (host && S.stage === "lobby" && S.players.length >= minPlayers(S.mode) && S.players.length <= MODES[S.mode].max) startGame();
      return;
    case "again": if (host && S.stage === "over") startGame(); return;
    case "lobby": if (host) { S.stage = "lobby"; S.g = null; } return;
    case "drop": if (host && g && S.stage === "play") dropPlayer(v); return;
  }
  if (!g || S.stage !== "play") return;

  switch (a.type) {
    case "newQ":
      if (host && g.phase === "answer" && !Object.keys(g.ans).length) drawCard(g, true);
      break;
    case "ans": {

      const out = g.groups[i].map(p => [p]);
      g.groups.splice(i, 1, ...out); bySize(g.groups);

    case "next":

  bySize(g.groups);

/* ================= networking =================
   Rooms are peer-to-peer (WebRTC via PeerJS). The host's phone holds the game;
   everyone else sends actions to it and receives the updated state.            */
const Net = { peer: null, conn: null, conns: new Map(), code: null, lost: false, retrying: false };

class Emitter { constructor() { this.h = {}; } on(e, f) { (this.h[e] = this.h[e] || []).push(f); return this; } emit(e, ...a) { (this.h[e] || []).forEach(f => f(...a)); } }

  constructor(peer, remote, cid) { super(); this.peer = peer; this.remote = remote; this.cid = cid; this.open = false; }

    setTimeout(() => this.emit("open", this.id), 20);
  }
  recv(m) {
    if (m.to !== this.id) return;
    const c = this.conns[m.cid];
    if (m.k === "c") {

      this.emit("connection", nc); BUS.postMessage({ k: "a", to: m.from, from: this.id, cid: m.cid });

    else if (m.k === "d" && c && c.open) c.emit("data", m.d);

async function loadPeer() {
  if (params.get("net") === "local" && BUS) return FakePeer;
  if (window.Peer) return window.Peer;
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js";
    s.onload = res; s.onerror = () => rej(new Error("Couldn't load online rooms. Check your internet connection."));
    document.head.appendChild(s);

}
function peerOpts() {
  const h = params.get("peerhost");               // for local testing against a self-hosted PeerServer
  if (!h) return { debug: 0 };
  const [host, port] = h.split(":");
  return { host, port: Number(port) || 9000, path: "/", secure: location.protocol === "https:", debug: 0 };
}
function hostRoom(code, keepCode, tries = 0) {
  return loadPeer().then(P => new Promise((res, rej) => {
    let opened = false;
    const peer = new P(PREFIX + code, peerOpts());
    peer.on("open", () => { opened = true; Net.peer = peer; Net.code = code; res(code); });
    peer.on("error", e => {
      if (!opened) {
        try { peer.destroy(); } catch (x) {}
        if (e.type === "unavailable-id" && !keepCode) hostRoom(newCode()).then(res, rej);
        else if (e.type === "unavailable-id" && tries < 6) setTimeout(() => hostRoom(code, true, tries + 1).then(res, rej), 3000);
        else if (e.type === "unavailable-id") rej(new Error("Room " + code + " is still in use. Try again in a minute, or start a new room."));
        else rej(new Error(e.type === "browser-incompatible" ? NO_RTC : "Couldn't open a room (" + (e.type || e.message) + ")."));
      }

    peer.on("disconnected", () => { setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (x) {} }, 1000); });
    peer.on("connection", conn => {
      conn.on("data", d => hostRecv(conn, d));
      conn.on("close", () => {
        if (conn.pid && Net.conns.get(conn.pid) === conn) {
          Net.conns.delete(conn.pid);

}
function hostRecv(conn, d) {
  if (!S || !d || typeof d !== "object") return;
  if (d.t === "join") {
    const pid = String(d.pid || "").slice(0, 24) || uid();
    let p = player(pid);
    if (!p) {
      if (S.players.length >= 20) { conn.send({ t: "err", msg: "That room is full." }); return; }
      p = { id: pid, name: uniqueName(cleanName(d.name) || "Player"), on: true };
      S.players.push(p);
    }
    p.on = true; conn.pid = pid;
    const old = Net.conns.get(pid);
    Net.conns.set(pid, conn);
    if (old && old !== conn) { try { old.close(); } catch (e) {} }
    conn.send({ t: "hello", pid });
    commit();
  } else if (d.t === "act" && conn.pid) { apply(d.a, conn.pid); commit(); }
  else if (d.t === "bye" && conn.pid) {

function joinRoom(code, name) {
  const pid = tabStore.get("herd-pid-" + code) || uid();
  return loadPeer().then(P => new Promise((res, rej) => {
    let done = false;
    const peer = new P(peerOpts());
    const fail = msg => { if (done) return; done = true; clearTimeout(timer); try { peer.destroy(); } catch (e) {} rej(new Error(msg)); };
    const timer = setTimeout(() => fail("Couldn't reach room " + code + ". Is the host's screen still open?"), 15000);
    peer.on("error", e => {
      if (!done) fail(e.type === "peer-unavailable" ? "No room called " + code + ". Check the code, or ask the host to keep Herd open."
        : e.type === "browser-incompatible" ? NO_RTC : "Couldn't connect (" + (e.type || e.message) + ").");
    });
    peer.on("open", () => {
      const conn = peer.connect(PREFIX + code, { reliable: true });
      conn.on("open", () => conn.send({ t: "join", pid, name }));
      conn.on("data", d => {
        if (!d) return;
        if (d.t === "hello") {
          ME = d.pid; ROLE = "guest"; tabStore.set("herd-pid-" + code, d.pid);
          if (!done) { done = true; clearTimeout(timer); if (Net.peer && Net.peer !== peer) { try { Net.peer.destroy(); } catch (e) {} } Net.peer = peer; Net.conn = conn; Net.code = code; Net.lost = false; res(); }
        } else if (d.t === "state") { S = d.S; Net.lost = false; saveLocal(); render(); }
        else if (d.t === "err") fail(d.msg);
        else if (d.t === "kicked") { goHome("The host removed you from the room."); }
        else if (d.t === "closed") { goHome("The host closed the room."); }
      });

        if (!done || Net.conn !== conn || ROLE !== "guest") return;
        Net.lost = true; render();

}
function reconnect(quiet) {

  const me = player(ME);

    .catch(e => { if (!quiet) toast(e.message); render(); });
}

}

}
function lobbyView() {
  const m = MODES[S.mode], set = S.sets[S.mode], host = ROLE === "host";
  const n = S.players.length, enough = n >= m.min, tooMany = n > m.max;
  return `<section class="screen">
    <div class="gtop"><span class="eyebrow grow">Room code</span><button class="ghost" data-a="share">Share invite</button>${host ? `<button class="ghost" data-a="closeRoom">Close</button>` : `<button class="ghost" data-a="leave">Leave</button>`}</div>
    <div class="room-code">${esc(S.code)}</div>
    <div class="faint small center">Others join by opening this page and tapping <b>Join a room</b>.</div>
    ${netbar()}
    <div class="card tint stack">
      <div class="row"><div class="grow"><div class="eyebrow">Tonight's game</div><div class="display" style="font-size:34px;color:var(--accent)">${m.name}</div></div>
        ${host ? `<button class="ghost" data-a="modePick">Change</button>` : ""}</div>
      <div class="dim" style="line-height:1.4">${m.pitch}</div>
      <hr class="sep"><div class="eyebrow">Quick rules</div>${rulesBlock(S.mode)}
    </div>
    <div class="row"><span class="eyebrow grow">Players (${n})</span></div>
    <div class="plist">${S.players.map(p => `<div class="p"><span class="dot ${p.on ? "" : "off"}"></span>
      <span class="nm">${esc(p.name)} ${p.id === S.hostId ? "👑" : ""} ${p.id === ME ? `<span class="you">(you)</span>` : ""}</span>
      ${host && p.id !== S.hostId ? `<button class="x" data-a="kick" data-v="${p.id}" aria-label="Remove ${esc(p.name)}">×</button>` : ""}</div>`).join("")}</div>
    <div class="card">${settingsBlock(S.mode, set, host)}</div>
    <div class="bottom">
      ${tooMany ? `<div class="err">${m.name} supports up to ${m.max} players. Remove someone to start.</div>` : ""}
      ${host ? `<button class="cta" data-a="start" ${enough && !tooMany ? "" : "disabled"}>${enough ? "Start " + m.name : `Waiting for ${m.min - n} more player${m.min - n > 1 ? "s" : ""}`}</button>`
             : wait(`Waiting for ${esc(nm(S.hostId))} to start`)}
    </div>
  </section>`;
}

/* ---------- the round: answer → match → reveal ---------- */
function gameView() {
  const g = S.g;
  const info = g.type === "herd" ? `Round ${g.round} · first to ${g.goal} 🐮` : `Round ${g.round}/${g.rounds}`;
  let h = topbar(info);
  if (!inGame()) return h + qCard(g) + spectator();
  const P = g.roster, answered = P.filter(p => g.ans[p] != null);
  const status = `<div class="chips">${P.map(p => `<span class="chip ${g.ans[p] != null ? "done" : ""}">${g.ans[p] != null ? "✓ " : ""}${esc(nm(p))}</span>`).join("")}</div>`;
  const hostCtl = ROLE === "pass" || ROLE === "host";

  if (g.phase === "answer") {
    const fresh = !answered.length && hostCtl ? `<button class="ghost" data-a="newQ">↻ Different question</button>` : "";
    if (ROLE === "pass") {
      const next = P.find(p => g.ans[p] == null);
      return h + handoff(nm(next), "Pass the phone to", "Answer in secret. Everyone else, look away.") + qCard(g) + answerInput(g, next)
        + `<div class="bottom">${fresh}<button class="cta" data-a="ans" data-v="${next}">Lock in secretly</button>
           <div class="faint small center">${answered.length}/${P.length} answered</div></div>`;
    }
    h += qCard(g);
    if (g.ans[ME] == null) return h + answerInput(g, ME) + `<div class="bottom">${fresh}<button class="cta" data-a="ans" data-v="${ME}">Lock in secretly</button></div>` + status;
    const mineTxt = typed(kindOf(g)) ? g.ans[ME] : parts(g).opts[g.ans[ME]];
    const off = ROLE === "host" ? P.filter(p => g.ans[p] == null && !online(p)) : [];
    return h + wait(`Locked in: “${esc(mineTxt)}”. Waiting for everyone (${answered.length}/${P.length})`) + status
      + off.map(p => `<div class="card stack"><div class="eyebrow">Answer for ${esc(nm(p))} (offline)</div>${answerInput(g, p)}<button class="ghost on" data-a="ans" data-v="${p}">Lock in for ${esc(nm(p))}</button></div>`).join("");
  }
  if (g.phase === "match") {
    h += qCard(g, true);
    h += `<p class="hint">${hostCtl
      ? `Here's what everyone said. If two groups mean the same thing, <b>tap one, then tap the group it belongs with</b>.`
      : `Here's what everyone said. ${esc(nm(S.hostId))} is merging answers that mean the same thing. Shout if you think two should count together!`}</p>`;
    h += groupList(g, hostCtl);
    if (hostCtl) h += `<div class="bottom"><button class="cta" data-a="score">Count it up</button></div>`;
    else h += wait(`Waiting for ${esc(nm(S.hostId))} to count it up`);
    return h;
  }
  if (g.phase === "reveal") {
    h += qCard(g, true);
    h += revealBanner(g);
    h += groupList(g, false);
    h += `<div class="eyebrow">Standings</div>` + standings(g, true);
    if (hostCtl) h += `<div class="bottom"><button class="cta" data-a="next">${gameOver(g) ? "See who won" : "Next question"}</button></div>`;
    else h += wait(`Waiting for ${esc(nm(S.hostId))} to move on`);
    return h;
  }
  return h;
}
function revealBanner(g) {
  const names = ps => ps.map(nm).map(esc).join(", ");
  const herd = g.win > -1 ? g.groups[g.win] : null;
  let h = "";
  if (g.type === "herd") {
    h += herd
      ? `<div class="banner good"><span class="big">“${esc(groupLabel(g, herd))}”</span>+1 🐮 for ${names(herd)}</div>`
      : `<div class="banner bad"><span class="big">No herd</span>${g.groups.length && g.groups[0].length >= 2 ? "It's a tie for most popular, so nobody scores." : "Everyone said something different, so nobody scores."}</div>`;
    const r = g.res;
    if (r.alone && r.moved) h += `<div class="banner pink">🩷 ${esc(nm(r.alone))} ${r.pinkFrom ? `takes the pink cow from ${esc(nm(r.pinkFrom))}` : "gets the pink cow"}</div>`;
    else if (r.alone) h += `<div class="banner pink">🩷 ${esc(nm(r.alone))} is alone again and keeps the pink cow</div>`;
    else if (g.pink) h += `<div class="faint small center">Nobody was alone this time, so ${esc(nm(g.pink))} keeps the pink cow.</div>`;
    if (g.winners.length) h += `<div class="banner good"><span class="big">${names(g.winners)} ${g.winners.length > 1 ? "win" : "wins"}!</span>${g.score[g.winners[0]]} cows and no pink cow</div>`;
    else {
      const stuck = g.pink && g.score[g.pink] >= g.goal;
      if (stuck) h += `<div class="faint small center">${esc(nm(g.pink))} has enough cows but can't win while holding the pink cow.</div>`;
    }
    return h;
  }
  if (!herd) return `<div class="banner bad"><span class="big">Everyone's Orange</span>${g.groups.length && g.groups[0].length >= 2 ? "It's a tie for most popular, so nobody goes Green." : "Nobody matched, so nobody goes Green."}</div>`;
  const stayed = herd.filter(p => g.res.before[p]), joined = herd.filter(p => !g.res.before[p]);
  return `<div class="banner good"><span class="big">“${esc(groupLabel(g, herd))}”</span>
    ${stayed.length ? `Stay Green, +2: ${names(stayed)}<br>` : ""}${joined.length ? `Join Green, +1: ${names(joined)}` : ""}</div>`;
}

/* ---------- game over ---------- */
function overView() {
  const g = S.g, m = MODES[S.mode];
  let head, sub;
  if (g.type === "herd") {
    const w = g.winners;
    head = w.length ? `${w.map(nm).join(" & ")} ${w.length > 1 ? "win" : "wins"}!` : "Game over";
    sub = w.length ? `${g.score[w[0]]} cows and no pink cow` : "Not enough players left to keep going";
  } else {
    const best = Math.max(...g.roster.map(p => g.score[p]));
    const w = g.roster.filter(p => g.score[p] === best);
    head = `${w.map(nm).join(" & ")} ${w.length > 1 ? "win" : "wins"}!`;
    sub = `${best} point${best === 1 ? "" : "s"} after ${g.round} round${g.round === 1 ? "" : "s"}`;
  }
  const host = isHostDevice();
  return `<section class="screen">
    <div class="center"><span class="mchip">${m.name}</span></div>
    <div class="banner good"><span class="big">${esc(head)}</span>${esc(sub)}</div>
    <div class="eyebrow">Final standings</div>${standings(g, false)}
    <div class="bottom">
      ${host ? `<button class="cta" data-a="again">Play ${m.name} again</button>
                <button class="cta alt" data-a="${ROLE === "pass" ? "changeGame" : "lobby"}">${ROLE === "pass" ? "Pick another game" : "Back to the lobby"}</button>`
             : wait(`Waiting for ${esc(nm(S.hostId))} to pick what's next`)}
      ${ROLE === "guest" ? `<button class="link" data-a="leave">Leave room</button>` : ""}
    </div>
  </section>`;
}

/* ---------- sheets ---------- */
function sheetView() {
  const s = U.sheet; if (!s) return "";
  let inner = "";
  if (s.k === "rules") {
    const k = s.mode;
    inner = `<div class="row"><div class="display grow" style="font-size:32px;color:${MODES[k].color}">${MODES[k].name}</div></div>
      ${rulesBlock(k)}<button class="cta" data-a="close">Got it</button>`;
  } else if (s.k === "menu") {
    const off = ROLE === "host" && S && S.g && S.stage === "play" ? S.g.roster.filter(p => p !== ME) : [];
    inner = `<div class="eyebrow">Menu</div>
      <button class="cta alt" data-a="rules">How to play ${MODES[S.mode].name}</button>
      ${S.g && S.stage === "play" ? `<button class="cta alt" data-a="scores">Standings</button>` : ""}
      ${S.play === "room" ? `<button class="cta alt" data-a="share">Share invite link (${esc(S.code)})</button>` : ""}
      ${off.length ? `<div class="eyebrow">Remove a player from this game</div><div class="chips">${off.map(p => `<button class="chip" data-a="drop" data-v="${p}">${online(p) ? "" : "⚪ "}${esc(nm(p))}</button>`).join("")}</div>` : ""}
      ${ROLE === "pass" ? `<button class="cta alt" data-a="endPass">End game</button>` : ""}
      ${ROLE === "host" ? `<button class="cta alt" data-a="lobby">End game, back to lobby</button><button class="cta alt" data-a="closeRoom">Close the room</button>` : ""}
      ${ROLE === "guest" ? `<button class="cta alt" data-a="leave">Leave room</button>` : ""}
      <button class="link" data-a="close">Close</button>`;
  } else if (s.k === "scores") {
    inner = `<div class="eyebrow">Standings</div>${standings(S.g, false)}<button class="cta" data-a="close">Close</button>`;
  } else if (s.k === "modes") {
    inner = `<div class="eyebrow">Pick a game</div><div class="modes">${Object.keys(MODES).map(k => modeCard(k).replace('data-a="pick"', 'data-a="setMode"')).join("")}</div>
      <button class="link" data-a="close">Cancel</button>`;
  } else if (s.k === "ask") {
    inner = `<div class="q" style="font-size:22px;font-weight:800">${esc(s.text)}</div>
      <button class="cta" data-a="${s.then}" ${s.v ? `data-v="${esc(s.v)}"` : ""}>${esc(s.yes)}</button>
      <button class="cta alt" data-a="close">Cancel</button>`;
  }
  return `<div class="sheet" data-a="scrim"><div class="in" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ================= render ================= */
function view() {
  if (!S) return ({ home: homeView, mode: modeView, setup: setupView, host: hostView, join: joinView, connecting: connectingView }[U.screen] || homeView)();
  if (S.stage === "lobby") return lobbyView();
  if (S.stage === "over") return overView();
  return `<section class="screen">${gameView()}</section>`;
}
let lastKey = "";
function render() {
  const mode = (S && S.mode) || (U.screen !== "home" && U.screen !== "join" ? U.pick : "") || "";
  document.body.dataset.mode = mode;
  if (!S || !S.g || S.g.phase !== "match") U.sel = null;
  if (U.sel != null && !S.g.groups[U.sel]) U.sel = null;
  const ae = document.activeElement;
  const keep = ae && ae.id && ae.tagName === "INPUT" ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  // only animate the screen when the "page" actually changes
  const g = S && S.g;
  const key = S ? [S.stage, g && g.phase, g && g.round, g && g.phase === "answer" && ROLE === "pass" ? Object.keys(g.ans).length : ""].join("|") : U.screen + U.pick;
  app.innerHTML = view();
  if (key === lastKey) app.querySelectorAll(".screen").forEach(el => el.style.animation = "none");
  lastKey = key;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  layer.innerHTML = sheetView();
  if (S && S.stage === "over" && !U.cele) { U.cele = true; confetti(); }
  if (!S || S.stage !== "over") U.cele = false;
}

/* ================= toast + confetti ================= */
let toastT;
function toast(msg) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#ff8fc7", "#2fd47a", "#ff9d3b", "#f5e7a1", "#f4f5f0"];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: cols[rnd(5)] }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += .15; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else c.remove();
  })();
}

/* ================= input handling ================= */
function inviteLink() {
  const u = new URL(location.href); u.search = ""; u.hash = "";
  u.searchParams.set("room", S.code);
  ["net", "peerhost"].forEach(k => { if (params.get(k)) u.searchParams.set(k, params.get(k)); });
  return u.toString();
}
async function share() {
  const url = inviteLink();
  try {
    if (navigator.share) { await navigator.share({ title: "Herd", text: `Join my Herd room: ${S.code}`, url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Invite link copied"); }
  catch (e) { prompt("Copy this link:", url); }
}
function addName() {
  const n = cleanName(U.drafts.newname);
  if (!n) return;
  if (U.pp.some(p => p.name.toLowerCase() === n.toLowerCase())) { toast(n + " is already playing"); return; }
  U.pp.push({ id: uid(), name: n });
  U.drafts.newname = ""; render();
  const el = $("#newname"); if (el) el.focus();
}
async function createRoom() {
  const name = cleanName(U.drafts.hostname ?? U.name);
  if (!name) { U.err = "Enter your name first."; render(); return; }
  U.name = name; store.set("herd-name", name);
  U.err = ""; U.net = "Opening a room…"; U.screen = "connecting"; render();
  const tok = U.conn = (U.conn || 0) + 1;
  try {
    const code = await hostRoom(newCode());
    if (tok !== U.conn) { try { Net.peer.destroy(); } catch (e) {} Net.peer = null; return; }
    ROLE = "host"; ME = uid();
    S = { v: 0, play: "room", code, mode: U.pick, hostId: ME, stage: "lobby", sets: JSON.parse(JSON.stringify(U.sets)),
          players: [{ id: ME, name, on: true }], g: null };
    commit();
  } catch (e) { if (tok !== U.conn) return; U.screen = "host"; U.err = e.message; render(); }
}
async function doJoin(code, name) {
  U.err = ""; U.net = `Joining room ${code}…`; U.screen = "connecting"; render();
  const tok = U.conn = (U.conn || 0) + 1;
  try {
    await joinRoom(code, name);
    if (tok !== U.conn) { goHome(); return; }
    ROLE = "guest"; U.screen = "home";
    store.set("herd-save", { role: "guest", code, mode: S && S.mode, t: Date.now() });
    render();
  } catch (e) { if (tok !== U.conn) return; U.screen = "join"; U.err = e.message; render(); }
}
async function resume() {
  const sv = store.get("herd-save", null); if (!sv) return;
  if (sv.role === "pass") { ROLE = "pass"; ME = null; S = sv.S; render(); return; }
  if (sv.role === "guest") { U.joinCode = sv.code; return doJoin(sv.code, U.name || "Player"); }
  U.net = `Reopening room ${sv.S.code}…`; U.screen = "connecting"; render();
  try {
    await hostRoom(sv.S.code, true);
    ROLE = "host"; ME = sv.me; S = sv.S;
    S.players.forEach(p => p.on = p.id === ME);
    commit();
  } catch (e) { U.screen = "home"; render(); toast(e.message); }
}

document.addEventListener("input", e => {
  const t = e.target; if (!t.id) return;
  if (t.id === "joincode") t.value = t.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  U.drafts[t.id] = t.value;
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.id) return;
  const id = e.target.id;
  if (id === "newname") addName();
  else if (id === "hostname") createRoom();
  else if (id === "joincode" || id === "joinname") handle("joinRoom");
  else if (id.startsWith("ans-")) handle("ans", id.slice(4));
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  if (el.dataset.a === "scrim" && e.target !== el) return;
  handle(el.dataset.a, el.dataset.v, el);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && U.sheet) { U.sheet = null; render(); } });

function ask(text, yes, then, v) { U.sheet = { k: "ask", text, yes, then, v }; render(); }
function handle(a, v, el) {
  switch (a) {
    /* ---- local navigation ---- */
    case "home": U.conn = (U.conn || 0) + 1; U.screen = "home"; U.err = ""; render(); scrollTo(0, 0); return;
    case "pick": U.pick = v; U.screen = "mode"; U.err = ""; render(); scrollTo(0, 0); return;
    case "goSetup": U.screen = "setup"; render(); scrollTo(0, 0); return;
    case "goHost": U.screen = "host"; U.err = ""; render(); scrollTo(0, 0); return;
    case "goJoin": U.screen = "join"; U.err = ""; render(); return;
    case "addName": addName(); return;
    case "rmName": U.pp = U.pp.filter(p => p.id !== v); render(); return;
    case "startPass": {
      const m = MODES[U.pick]; if (U.pp.length < m.min || U.pp.length > m.max) return;
      ROLE = "pass"; ME = null;
      S = { v: 0, play: "pass", code: null, mode: U.pick, hostId: null, stage: "lobby", sets: JSON.parse(JSON.stringify(U.sets)),
            players: U.pp.map(p => ({ id: p.id, name: p.name, on: true })), g: null };
      startGame(); commit(); scrollTo(0, 0); return;
    }
    case "createRoom": createRoom(); return;
    case "joinRoom": {
      const code = String(U.drafts.joincode ?? U.joinCode).toUpperCase(), name = cleanName(U.drafts.joinname ?? U.name);
      if (code.length !== 4) { U.err = "Room codes are 4 letters."; render(); return; }
      if (!name) { U.err = "Enter your name."; render(); return; }
      U.joinCode = code; U.name = name; store.set("herd-name", name);
      doJoin(code, name); return;
    }
    case "resume": resume(); return;
    case "reconnect": reconnect(false); return;
    case "share": share(); return;
    case "rules": U.sheet = { k: "rules", mode: (S && S.mode) || U.pick }; render(); return;
    case "menu": U.sheet = { k: "menu" }; render(); return;
    case "scores": U.sheet = { k: "scores" }; render(); return;
    case "modePick": U.sheet = { k: "modes" }; render(); return;
    case "close": case "scrim": U.sheet = null; render(); return;
    case "leave": ask("Leave this room?", "Leave", "yesLeave"); return;
    case "closeRoom": ask("Close the room for everyone?", "Close room", "yesClose"); return;
    case "endPass": ask("End this game?", "End game", "yesEnd"); return;
    case "yesLeave": case "yesClose": goHome(); return;
    case "yesEnd": { const k = S.mode; goHome(); U.pick = k; U.screen = "mode"; render(); return; }
    case "changeGame": goHome(); return;
    case "choose": { const [pid, i] = String(v).split(":"); U.drafts["pick-" + pid] = Number(i); render(); return; }
    case "gtap": {
      const i = Number(v);
      if (U.sel == null) U.sel = i;
      else if (U.sel === i) U.sel = null;
      else { const from = U.sel; U.sel = null; act({ type: "merge", from, to: i }); return; }
      render(); return;
    }

    /* ---- pass-mode settings before a game exists ---- */
    case "set":
      if (!S) { U.sets[U.pick][el.dataset.k] = Number(v); store.set("herd-sets", U.sets); render(); return; }
      act({ type: "set", k: el.dataset.k, v }); return;

    /* ---- game actions (go through the host) ---- */
    case "setMode": U.sheet = null; act({ type: "setMode", v }); return;
    case "ans": {
      const g = S.g;
      if (typed(kindOf(g))) {
        const raw = cleanAns(U.drafts["ans-" + v]);
        if (!raw) { toast("Type an answer first"); return; }
        act({ type: "ans", v, val: raw }); delete U.drafts["ans-" + v];
      } else {
        const i = U.drafts["pick-" + v];
        if (i == null) { toast("Pick an answer first"); return; }
        act({ type: "ans", v, val: i }); delete U.drafts["pick-" + v];
      }
      if (ROLE === "pass") scrollTo(0, 0);
      return;
    }
    case "drop": ask(`Remove ${nm(v)} from this game?`, "Remove", "yesDrop", v); return;
    case "yesDrop": U.sheet = null; act({ type: "drop", v }); return;
    case "lobby": U.sheet = null; act({ type: "lobby" }); return;
    case "score": case "next": act({ type: a, v }); scrollTo(0, 0); return;
    default: act({ type: a, v });
  }
}
